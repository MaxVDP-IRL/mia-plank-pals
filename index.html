<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF7EC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plank Pals">
  <meta name="format-detection" content="telephone=no">
  <title>Plank Pals</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="splash"><span>🐾</span></div>

  <!-- ============ SETUP (grown-up, first launch) ============ -->
  <section id="screen-setup" class="screen screen--scroll parent-style" hidden>
    <div class="setup">
      <h1>🐾 Plank Pals: grown-up setup</h1>
      <p class="hint">Everything stays on this phone. Nothing is sent anywhere.</p>
      <label class="pc-label" for="setup-name">Child's name</label>
      <input id="setup-name" class="text-input" maxlength="20" placeholder="Name" autocomplete="off" autocapitalize="words" spellcheck="false">
      <span class="pc-label">Starting goals</span>
      <div class="pc-group">
        <div class="pc-row"><span class="row-pic" data-pic="plank"></span><span class="grow">Plank</span>
          <div class="stepper" id="setup-plank"><button type="button" data-step="-1" aria-label="Less">−</button><output></output><button type="button" data-step="1" aria-label="More">+</button></div></div>
        <div class="pc-row"><span class="row-pic" data-pic="squat"></span><span class="grow">Squats</span>
          <div class="stepper" id="setup-squat"><button type="button" data-step="-1" aria-label="Less">−</button><output></output><button type="button" data-step="1" aria-label="More">+</button></div></div>
      </div>
      <div class="sound-row">
        <button type="button" class="btn btn-parent" id="setup-test">🔊 Test sound</button>
        <span class="hint">No sound? Check the silent switch on the side of the phone.</span>
      </div>
      <div class="spacer"></div>
      <button type="button" class="btn btn-big" id="setup-go" disabled><span class="btn-text" id="setup-go-text">Hand the phone over →</span></button>
    </div>
  </section>

  <!-- ============ MEET PUP ============ -->
  <section id="screen-meet" class="screen" hidden>
    <div class="meet-basket" id="meet-basket-phase">
      <div class="meet-top"><div class="bubble bubble-free" id="meet-bubble" hidden></div></div>
      <div class="basket-stage is-wiggling" id="meet-basket" role="button" aria-label="Open the basket">
        <svg class="basket basket-back" viewBox="0 0 200 160" overflow="visible">
          <path d="M50 66 Q100 -12 150 66" fill="none" stroke="#8A5A2B" stroke-width="8" stroke-linecap="round"/>
          <ellipse cx="100" cy="70" rx="76" ry="12" fill="#6E4623"/>
        </svg>
        <div class="basket-pup pup-wrap" id="meet-basket-pup" style="--pup-size:180px"></div>
        <svg class="basket basket-front" viewBox="0 0 200 160" overflow="visible">
          <path d="M28 72 L172 72 L154 150 Q100 160 46 150 Z" fill="#C98B4E" stroke="#8A5A2B" stroke-width="4" stroke-linejoin="round"/>
          <path d="M36 96 H164 M42 120 H158" stroke="#A86F38" stroke-width="5" stroke-linecap="round"/>
          <path d="M60 76 V148 M85 76 V152 M115 76 V152 M140 76 V148" stroke="#A86F38" stroke-width="3" opacity=".6"/>
          <rect x="20" y="62" width="160" height="16" rx="8" fill="#B8733F"/>
          <g class="basket-blanket">
            <path d="M30 66 Q58 30 100 46 Q142 28 170 66 Z" fill="#FF9AA2"/>
            <circle cx="70" cy="52" r="4" fill="#fff"/><circle cx="100" cy="44" r="4" fill="#fff"/>
            <circle cx="132" cy="50" r="4" fill="#fff"/><circle cx="116" cy="60" r="4" fill="#fff"/>
            <circle cx="84" cy="61" r="4" fill="#fff"/>
          </g>
        </svg>
      </div>
    </div>
    <div class="meet-names" id="meet-names-phase" hidden>
      <div class="pup-wrap" id="meet-pup" data-bubble style="--pup-size:170px; margin-top:28px"></div>
      <div class="name-grid" id="meet-grid"></div>
      <button type="button" class="link-btn" id="meet-type">✏️ Grown-up: type a name</button>
      <div class="meet-type" id="meet-type-row" hidden>
        <input class="text-input" id="meet-type-input" maxlength="12" placeholder="Pet name" autocomplete="off" spellcheck="false">
        <button type="button" class="btn btn-parent" id="meet-type-ok">OK</button>
      </div>
    </div>
    <div class="name-ask" id="meet-ask" hidden>
      <div class="name-ask-card" role="dialog" aria-modal="true" aria-labelledby="meet-ask-q">
        <div class="name-ask-emoji" id="meet-ask-emoji" aria-hidden="true"></div>
        <p class="name-ask-q" id="meet-ask-q"></p>
        <div class="name-ask-actions">
          <button type="button" class="btn btn-big" id="meet-ask-yes">Yes</button>
          <button type="button" class="btn btn-big btn-big--soft" id="meet-ask-no">No</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ HOME ============ -->
  <section id="screen-home" class="screen" hidden>
    <div class="topbar home-top">
      <div class="paws" id="home-paws"></div>
      <button type="button" class="btn btn-lock" id="home-lock" aria-label="Grown-ups">🔒</button>
    </div>
    <div class="home-pup-area">
      <div class="pup-wrap" id="home-pup" data-bubble style="--pup-size:200px" role="button" aria-label="Pup"></div>
      <div class="bowl-wrap home-bowl"><div class="bowl" id="home-bowl"><div class="bowl-fill"></div></div><span class="bowl-bone">🦴</span></div>
    </div>
    <div class="pet-name" id="home-petname"></div>
    <div class="spacer"></div>
    <div class="ex-row">
      <button type="button" class="btn btn-ex btn-ex--plank" id="home-plank">
        <span class="ex-badge"></span>
        <span class="ex-pic pup-wrap fixed-size" style="--pup-size:130px"></span>
        Plank <span class="ex-goal" id="home-plank-goal"></span>
      </button>
      <button type="button" class="btn btn-ex btn-ex--squat" id="home-squat">
        <span class="ex-badge"></span>
        <span class="ex-pic pup-wrap fixed-size" style="--pup-size:96px"></span>
        Squats <span class="ex-goal" id="home-squat-goal"></span>
      </button>
    </div>
    <div class="tile-row">
      <button type="button" class="btn btn-tile" id="home-book"><span class="emoji">📖</span>Stickers</button>
      <button type="button" class="btn btn-tile" id="home-progress"><span class="emoji">🏆</span>Progress</button>
    </div>
  </section>

  <!-- ============ PLANK ============ -->
  <section id="screen-plank" class="screen ex" hidden>
    <div class="topbar">
      <button type="button" class="btn btn-icon" data-own-tap data-act="home" aria-label="Home">🏠</button>
      <button type="button" class="btn btn-icon" data-own-tap data-act="tip" aria-label="How to">❓</button>
    </div>
    <div class="phase" data-phase="countdown">
      <div class="tip-card" data-tip hidden><div class="emoji"></div><div class="text"></div><div class="tip-dots"></div><div class="side"></div></div>
      <div class="get-ready" data-getready>Get ready!</div>
      <div class="countdown" data-countdown></div>
      <div class="pup-wrap" data-pup-cd data-bubble style="--pup-size:170px"></div>
    </div>
    <div class="phase" data-phase="running" hidden>
      <div class="ring-wrap" style="--size:300px; --stroke:22">
        <svg class="ring" viewBox="0 0 300 300" aria-hidden="true">
          <circle class="ring-track" cx="150" cy="150" r="138"/>
          <circle class="ring-fill" cx="150" cy="150" r="138"/>
          <circle class="ring-sparkle" cx="150" cy="150" r="148"/>
        </svg>
        <span class="ring-bone">🦴</span>
        <span class="record-cup">🏆</span>
        <div class="ring-center"><div class="timer" data-timer>0</div></div>
      </div>
      <div class="pup-wrap plank-run-pup" data-pup-run data-bubble style="--pup-size:230px; margin-top:28px"></div>
      <div class="spacer"></div>
      <div class="stop-hint">✋</div>
    </div>
    <div class="phase" data-phase="ready" hidden>
      <div class="spacer"></div>
      <div class="pup-wrap" data-pup-ready data-bubble style="--pup-size:200px"></div>
      <div class="spacer"></div>
      <button type="button" class="btn btn-big ready-go ex-plank" data-own-tap data-act="go" aria-label="Go">🐾</button>
    </div>
    <div class="phase" data-phase="falseStart" hidden>
      <div class="spacer"></div>
      <div class="pup-wrap" data-pup-false data-bubble style="--pup-size:180px"></div>
      <div class="spacer"></div>
      <div class="early-row">
        <button type="button" class="btn btn-big btn-big--soft" data-own-tap data-act="retry" aria-label="Try again">🔁</button>
        <button type="button" class="btn btn-big" data-own-tap data-act="count" aria-label="Count it">✅</button>
      </div>
    </div>
  </section>

  <!-- ============ SQUATS ============ -->
  <section id="screen-squats" class="screen ex" hidden>
    <div class="topbar">
      <button type="button" class="btn btn-icon" data-own-tap data-act="home" aria-label="Home">🏠</button>
      <button type="button" class="btn btn-icon" data-own-tap data-act="tip" aria-label="How to">❓</button>
      <button type="button" class="btn btn-icon" data-own-tap data-act="redo" aria-label="Redo" hidden>🔁</button>
    </div>
    <div class="phase" data-phase="countdown">
      <div class="tip-card" data-tip hidden><div class="emoji"></div><div class="text"></div><div class="tip-dots"></div><div class="side"></div></div>
      <div class="get-ready" data-getready>Get ready!</div>
      <div class="countdown" data-countdown></div>
      <div class="pup-wrap" data-pup-cd data-bubble style="--pup-size:170px"></div>
    </div>
    <div class="phase" data-phase="running" hidden>
      <div class="ring-wrap" style="--size:220px; --stroke:20">
        <svg class="ring" viewBox="0 0 220 220" aria-hidden="true">
          <circle class="ring-track" cx="110" cy="110" r="100"/>
          <circle class="ring-fill" cx="110" cy="110" r="100"/>
          <circle class="ring-sparkle" cx="110" cy="110" r="110"/>
        </svg>
        <span class="ring-bone">🦴</span>
        <span class="record-cup">🏆</span>
        <div class="ring-center"><div class="count" data-count>0</div></div>
      </div>
      <div class="spacer"></div>
      <div class="pup-wrap squat-pup" data-pup-run style="--pup-size:340px"></div>
      <div class="floor-shadow" data-shadow></div>
      <div class="spacer"></div>
    </div>
    <div class="phase" data-phase="ready" hidden>
      <div class="spacer"></div>
      <div class="pup-wrap" data-pup-ready data-bubble style="--pup-size:200px"></div>
      <div class="spacer"></div>
      <button type="button" class="btn btn-big ready-go ex-squat" data-own-tap data-act="go" aria-label="Go">🐾</button>
    </div>
    <div class="phase" data-phase="countCheck" hidden>
      <div class="pup-wrap" data-pup-check data-bubble style="--pup-size:170px; margin-top:80px"></div>
      <div class="count-check-row">
        <button type="button" class="btn btn-icon btn-icon--xl" data-own-tap data-act="minus" aria-label="One less">−</button>
        <div class="count" data-check-count>0</div>
        <button type="button" class="btn btn-icon btn-icon--xl" data-own-tap data-act="plus" aria-label="One more">+</button>
      </div>
      <div class="spacer"></div>
      <button type="button" class="btn btn-big" data-own-tap data-act="ok" aria-label="Yes">✅</button>
    </div>
  </section>

  <!-- ============ CELEBRATE ============ -->
  <section id="screen-celebrate" class="screen" hidden>
    <div class="cel-result" id="cel-result"></div>
    <div class="pup-wrap cel-pup" id="cel-pup" data-bubble style="--pup-size:170px"></div>
    <div class="bowl-wrap cel-bowl" id="cel-bowl-wrap"><div class="bowl bowl--big" id="cel-bowl"><div class="bowl-fill"></div></div><span class="bowl-bone">🦴</span></div>
    <div class="cel-reward" id="cel-reward"></div>
    <div class="cel-note" id="cel-note"></div>
    <div class="spacer"></div>
    <div class="cel-actions" id="cel-actions"></div>
  </section>

  <!-- ============ STICKER BOOK ============ -->
  <section id="screen-stickers" class="screen" hidden>
    <div class="topbar">
      <button type="button" class="btn btn-icon" id="book-home" aria-label="Home">🏠</button>
      <div class="page-chip"><span class="e" id="book-page-emoji"></span><span class="page-dots" id="book-dots"></span></div>
      <div class="book-chips" id="book-chips"></div>
    </div>
    <div id="book-page"></div>
    <div class="spacer"></div>
    <div class="book-nav">
      <button type="button" class="btn btn-icon" id="book-prev" aria-label="Back">◀</button>
      <span class="count-label" id="book-count"></span>
      <button type="button" class="btn btn-icon" id="book-next" aria-label="Next">▶</button>
    </div>
    <div class="prize-strip" id="book-prize" hidden></div>
  </section>

  <!-- ============ PROGRESS ============ -->
  <section id="screen-progress" class="screen screen--scroll" hidden>
    <div class="topbar">
      <button type="button" class="btn btn-icon" id="prog-home" aria-label="Home">🏠</button>
      <span style="font-size:40px">🏆</span>
      <span style="width:64px"></span>
    </div>
    <div class="card-box path-card" id="prog-path"></div>
    <div class="card-box" id="prog-cal"></div>
    <div class="trophies" id="prog-trophies"></div>
    <div style="height:24px"></div>
  </section>

  <!-- ============ PARENT CORNER ============ -->
  <section id="screen-parent" class="screen screen--scroll parent-style" hidden>
    <div class="topbar">
      <button type="button" class="btn btn-icon" id="pc-home" aria-label="Home">🏠</button>
      <span class="pc-title">Parent Corner</span>
    </div>
    <div id="pc-body"></div>
  </section>

  <div id="gate" class="overlay" hidden></div>
  <div id="banner" class="banner" role="status" hidden></div>

  <template id="pup-tpl">
<svg class="pup" data-stage="1" data-mood="idle" viewBox="0 0 200 200" overflow="visible"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pup">
  <g class="pup-root">
    <path class="acc acc-cape" d="M62 124 Q34 170 44 196 L156 196 Q166 170 138 124 Z"
          fill="#E5484D" stroke="#FFC83D" stroke-width="4" stroke-linejoin="round"/>
    <g class="pup-body">
      <g class="pup-tail">
        <path d="M140 156 Q176 146 172 112" fill="none" stroke="#E8A96B" stroke-width="13" stroke-linecap="round"/>
        <circle cx="172" cy="112" r="7" fill="#B8733F"/>
      </g>
      <ellipse cx="100" cy="152" rx="48" ry="38" fill="#E8A96B"/>
      <ellipse cx="100" cy="160" rx="28" ry="24" fill="#FFF3E0"/>
    </g>
    <g class="pup-paws">
      <ellipse cx="78" cy="184" rx="15" ry="9" fill="#FFF3E0" stroke="#E8A96B" stroke-width="3"/>
      <g class="pup-paw-r">
        <ellipse cx="122" cy="184" rx="15" ry="9" fill="#FFF3E0" stroke="#E8A96B" stroke-width="3"/>
      </g>
      <g class="acc acc-sneakers">
        <ellipse cx="78" cy="183" rx="17" ry="10" fill="#5EC8F2"/>
        <rect x="61" y="187" width="34" height="6" rx="3" fill="#fff"/>
        <path d="M71 180 H85" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="122" cy="183" rx="17" ry="10" fill="#5EC8F2"/>
        <rect x="105" y="187" width="34" height="6" rx="3" fill="#fff"/>
        <path d="M115 180 H129" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
    <g class="pup-head">
      <circle cx="100" cy="88" r="50" fill="#E8A96B"/>
      <ellipse cx="121" cy="78" rx="15" ry="14" fill="#D08A50"/>
      <g class="pup-eyes-size">
        <g class="pup-eyes">
          <circle cx="80"  cy="80" r="7.5" fill="#3B2A20"/>
          <circle cx="120" cy="80" r="7.5" fill="#3B2A20"/>
          <circle cx="82.5"  cy="77.5" r="2.6" fill="#fff"/>
          <circle cx="122.5" cy="77.5" r="2.6" fill="#fff"/>
        </g>
      </g>
      <g class="pup-eyes-happy" fill="none" stroke="#3B2A20" stroke-width="4.5" stroke-linecap="round">
        <path d="M72 83 Q80 73 88 83"/><path d="M112 83 Q120 73 128 83"/>
      </g>
      <g class="pup-eyes-sleepy" fill="none" stroke="#3B2A20" stroke-width="4" stroke-linecap="round">
        <path d="M72 80 Q80 87 88 80"/><path d="M112 80 Q120 87 128 80"/>
      </g>
      <ellipse cx="100" cy="110" rx="26" ry="19" fill="#FFF3E0"/>
      <circle cx="70"  cy="104" r="7" fill="#FF9AA2" opacity=".55"/>
      <circle cx="130" cy="104" r="7" fill="#FF9AA2" opacity=".55"/>
      <path class="pup-tongue" d="M94 112 Q100 125 106 112 Z" fill="#FF7A8A"/>
      <ellipse cx="100" cy="100" rx="8.5" ry="6" fill="#3B2A20"/>
      <circle cx="97" cy="98" r="2" fill="#fff" opacity=".7"/>
      <path d="M100 106 V110 M100 110 Q94 116 89 111 M100 110 Q106 116 111 111"
            fill="none" stroke="#3B2A20" stroke-width="3" stroke-linecap="round"/>
      <g class="acc acc-headband">
        <path d="M56 66 Q100 30 144 66" fill="none" stroke="#5EC8F2" stroke-width="11" stroke-linecap="round"/>
        <path d="M60 64 Q100 33 140 64" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>
      </g>
      <ellipse cx="54"  cy="86" rx="14" ry="28" fill="#B8733F" transform="rotate(18 54 86)"/>
      <ellipse cx="146" cy="86" rx="14" ry="28" fill="#B8733F" transform="rotate(-18 146 86)"/>
    </g>
    <g class="pup-neck">
      <g class="acc acc-bandana">
        <path d="M64 130 Q100 142 136 130 L100 170 Z" fill="#E5484D" stroke-linejoin="round"/>
        <circle cx="86" cy="140" r="3" fill="#fff"/><circle cx="112" cy="141" r="3" fill="#fff"/>
        <circle cx="100" cy="156" r="3" fill="#fff"/>
      </g>
      <g class="acc acc-collar">
        <rect x="64" y="128" width="72" height="10" rx="5" fill="#2FA3D1"/>
        <polygon class="acc-tag" fill="#FFC83D" stroke="#E0A200" stroke-width="1.5" stroke-linejoin="round"
          points="100,139 102.2,144.4 108,144.6 103.5,148.3 104.9,154 100,150.8 95.1,154 96.5,148.3 92,144.6 97.8,144.4"/>
      </g>
      <g class="acc acc-medal">
        <path d="M84 132 L96 132 L104 156 L94 156 Z" fill="#5EC8F2"/>
        <path d="M116 132 L104 132 L96 156 L106 156 Z" fill="#2FA3D1"/>
        <circle cx="100" cy="165" r="13" fill="#FFC83D" stroke="#E0A200" stroke-width="3"/>
        <polygon fill="#fff" points="100,158 101.8,162.6 106.7,162.8 102.9,165.9 104.1,170.7 100,168 95.9,170.7 97.1,165.9 93.3,162.8 98.2,162.6"/>
      </g>
    </g>
  </g>
</svg>
  </template>

  <template id="pup-plank-tpl">
<svg class="pup pup-plank" data-stage="1" data-mood="plank" viewBox="0 0 160 100" overflow="visible"
     xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pup doing a plank">
  <g class="pp-root">
    <g class="pp-tail"><path d="M126 50 Q146 38 146 22" fill="none" stroke="#B8733F" stroke-width="7" stroke-linecap="round"/></g>
    <path d="M122 56 L132 84" stroke="#E8A96B" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="136" cy="87" rx="9" ry="4.5" fill="#FFF3E0"/>
    <ellipse cx="88" cy="54" rx="44" ry="15" fill="#E8A96B" transform="rotate(-6 88 54)"/>
    <ellipse cx="88" cy="60" rx="30" ry="7"  fill="#FFF3E0" transform="rotate(-6 88 60)"/>
    <path d="M54 60 L54 80 M54 83 L32 83" stroke="#E8A96B" stroke-width="10" stroke-linecap="round" fill="none"/>
    <ellipse cx="28" cy="84" rx="8" ry="4.5" fill="#FFF3E0"/>
    <circle cx="38" cy="40" r="20" fill="#E8A96B"/>
    <ellipse cx="22" cy="46" rx="11" ry="8" fill="#FFF3E0"/>
    <ellipse cx="13" cy="43" rx="4" ry="3" fill="#3B2A20"/>
    <circle cx="30" cy="36" r="3.4" fill="#3B2A20"/><circle cx="31.2" cy="34.8" r="1.1" fill="#fff"/>
    <circle cx="33" cy="48" r="4" fill="#FF9AA2" opacity=".55"/>
    <path d="M16 50 Q21 53 26 50" fill="none" stroke="#3B2A20" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="48" cy="38" rx="7" ry="13" fill="#B8733F" transform="rotate(15 48 38)"/>
  </g>
  <path d="M4 92 H156" stroke="#EADBC8" stroke-width="4" stroke-linecap="round"/>
</svg>
  </template>
  <noscript>This app needs JavaScript.</noscript>
</body>
</html>
